{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Online Santha{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="auth-card">
            <div class="card">
                <div class="card-header text-center">
                    <h3><i class="fas fa-sign-in-alt me-2"></i>Welcome Back</h3>
                    <p class="mb-0">Login to your Online Santha account</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    <div class="text-center">
                        <p>Don't have an account? <a href="{% url 'accounts:register' %}" class="text-decoration-none">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
